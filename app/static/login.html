<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>El Amigo — Sign in</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f7f8fa;
            color: #17202a;
        }

        .login {
            width: min(100%, 390px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: #17202a;
            color: white;
            font-weight: 800;
        }

        .brand h1 {
            margin: 0;
            font-size: 21px;
        }

        .brand span {
            display: block;
            margin-top: 2px;
            color: #7b8490;
            font-size: 13px;
        }

        .card {
            padding: 28px;
            border: 1px solid #e3e6ea;
            border-radius: 18px;
            background: white;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, .06);
        }

        h2 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        p {
            margin: 0 0 24px;
            color: #6f7883;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d9dde2;
            border-radius: 10px;
            outline: none;
            font: inherit;
        }

        input:focus {
            border-color: #17202a;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px 14px;
            border: 0;
            border-radius: 10px;
            background: #17202a;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .error {
            margin: 0 0 18px;
            padding: 10px 12px;
            border-radius: 9px;
            background: #fff1f1;
            color: #a12626;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="login">
        <div class="brand">
            <div class="mark">EA</div>
            <div>
                <h1>El Amigo</h1>
                <span>StudyMate</span>
            </div>
        </div>

        <section class="card">
            <h2>Welcome to StudyMate</h2>
            <p>
                Sign in to continue to your study workspace.
            </p>

            <div
                id="loginError"
                class="error"
                hidden
            >
                Username or password is incorrect.
            </div>

            <form
                method="post"
                action="/login"
            >
                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    value="learner"
                    required
                    autofocus
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Sign in
                </button>
            </form>
        </section>
    </main>

    <script>
        if (
            new URLSearchParams(
                window.location.search
            ).get("error")
        ) {
            document.getElementById(
                "loginError"
            ).hidden = false;
        }
    </script>
</body>
</html>
